<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | Sociable</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="{{ url_for('static', path='styles/style.css') }}?v=20260302" rel="stylesheet">
</head>
<body>
    <div class="bg-layer"></div>

    <header class="topbar">
        <a href="/" class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">Sociable</span>
        </a>
        <div class="buttons">
            <a href="/" class="btn btn-ghost">На главную</a>
        </div>
    </header>

    <div class="hero-section">
        <p class="hero-kicker">Добро пожаловать</p>
        <h1>Вход в аккаунт</h1>
    </div>

    <main>
        <div class="auth-main">
            <div class="auth-card">
                <form method="post">
                    <label for="username">Имя пользователя</label>
                    <input id="username" type="text" name="username" placeholder="Введите имя пользователя" required>

                    <label for="password">Пароль</label>
                    <input id="password" type="password" name="password" placeholder="Введите пароль" required>

                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
